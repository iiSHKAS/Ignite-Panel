name: "🚀 Feature Request"
description: "Suggest a new idea or improvement for Ignite Panel"
labels: ["enhancement", "idea"]
body:
  - type: markdown
    attributes:
      value: |
        Have a great idea? We'd love to hear it! Please describe the feature you'd like to see.

  - type: textarea
    id: feature-description
    attributes:
      label: "What is your feature request?"
      description: "A clear and concise description of what you want to happen."
    validations:
      required: true

  - type: textarea
    id: problem-solved
    attributes:
      label: "What problem does this solve?"
      description: "Is your feature request related to a problem? Please describe."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "Proposed Solution"
      description: "How do you imagine this feature working?"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "Category"
      options:
        - "New Plugin"
        - "UI/UX Improvement"
        - "Core System"
        - "Android App"
        - "API/Developer Tools"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or features you've considered?"

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Add any other context, screenshots, or examples here."
